<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>轻课堂 · 高考选科域 ER 图</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#f8fafc; --color-ink:#0f172a; --color-muted:#475569; --color-accent:#0ea5e9;
      --font-sans:'Geist','PingFang SC',system-ui,sans-serif; --font-serif:'Instrument Serif','Noto Serif SC',serif; --font-mono:'Geist Mono',ui-monospace,monospace; }
    body { font-family:var(--font-sans); background:var(--color-paper); color:var(--color-ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:3rem 2rem; }
    .frame { max-width:1120px; width:100%; }
    .eyebrow { font-family:var(--font-mono); font-size:0.66rem; font-weight:500; letter-spacing:0.18em; text-transform:uppercase; color:var(--color-muted); margin-bottom:0.5rem; }
    h1 { font-family:var(--font-serif); font-size:clamp(1.5rem,2.4vw + .75rem,2rem); font-weight:400; letter-spacing:-0.02em; line-height:1.15; margin-bottom:1.5rem; }
    svg { width:100%; min-width:900px; display:block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">ER / DATA MODEL · DOMAIN 6 / 10</p>
    <h1>高考选科域 · 实体关系</h1>
    <svg viewBox="0 0 1000 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="er-gaokao-title er-gaokao-desc">
      <title id="er-gaokao-title">轻课堂高考选科域实体关系图</title>
      <desc id="er-gaokao-desc">高考方案定义选科策略,学生提交选科组合,按组合生成教学班,教学班编排学生与课表。</desc>
      <rect width="100%" height="100%" fill="#f8fafc"/>

      <!-- 连线 -->
      <path d="M 500 144 L 500 200" fill="none" stroke="#475569" stroke-width="1"/>
      <rect x="476" y="150" width="14" height="12" fill="#f8fafc"/><text x="483" y="159" font-size="8" fill="#475569" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>
      <rect x="476" y="188" width="14" height="12" fill="#f8fafc"/><text x="483" y="197" font-size="8" fill="#475569" font-family="'Geist Mono', monospace" text-anchor="middle">N</text>
      <rect x="508" y="164" width="60" height="14" fill="#f8fafc"/><text x="538" y="175" font-size="9" fill="#475569" font-family="'Geist', sans-serif" text-anchor="middle">提交选科</text>

      <path d="M 636 264 L 704 264" fill="none" stroke="#475569" stroke-width="1"/>
      <rect x="642" y="244" width="24" height="12" fill="#f8fafc"/><text x="654" y="253" font-size="8" fill="#7a8399" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>
      <rect x="676" y="244" width="24" height="12" fill="#f8fafc"/><text x="688" y="253" font-size="8" fill="#7a8399" font-family="'Geist Mono', monospace" text-anchor="middle">N</text>
      <rect x="640" y="268" width="64" height="14" fill="#f8fafc"/><text x="672" y="279" font-size="9" fill="#475569" font-family="'Geist', sans-serif" text-anchor="middle">编入教学班</text>

      <path d="M 864 200 L 864 248" fill="none" stroke="#475569" stroke-width="1"/>
      <rect x="872" y="206" width="24" height="12" fill="#f8fafc"/><text x="884" y="215" font-size="8" fill="#7a8399" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>
      <rect x="872" y="236" width="24" height="12" fill="#f8fafc"/><text x="884" y="245" font-size="8" fill="#7a8399" font-family="'Geist Mono', monospace" text-anchor="middle">N</text>

      <path d="M 264 264 L 192 264" fill="none" stroke="#475569" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="210" y="244" width="48" height="12" fill="#f8fafc"/><text x="234" y="253" font-size="8" fill="#7a8399" font-family="'Geist Mono', monospace" text-anchor="middle">成员</text>

      <!-- GAOKAO_SCHEME(聚合根) -->
      <g>
        <rect x="352" y="40" width="296" height="104" rx="6" fill="rgba(14,165,233,0.10)" stroke="#0ea5e9" stroke-width="1.2"/>
        <rect x="360" y="46" width="44" height="12" rx="2" fill="none" stroke="rgba(14,165,233,0.50)" stroke-width="0.8"/>
        <text x="382" y="55" fill="rgba(2,132,199,0.90)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ROOT</text>
        <text x="360" y="78" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', sans-serif">高考方案 GAOKAO_SCHEME</text>
        <text x="360" y="98" fill="#475569" font-size="9" font-family="'Geist Mono', monospace"># id · entry_year : UK</text>
        <text x="360" y="114" fill="#475569" font-size="9" font-family="'Geist Mono', monospace">strategy_config : 3+1+2 / 3+3</text>
        <text x="360" y="130" fill="#475569" font-size="9" font-family="'Geist Mono', monospace">is_active · 走班学科归属</text>
      </g>

      <!-- SUBJECT_CHOICE -->
      <g>
        <rect x="352" y="200" width="284" height="128" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
        <rect x="360" y="206" width="44" height="12" rx="2" fill="none" stroke="rgba(15,23,42,0.40)" stroke-width="0.8"/>
        <text x="382" y="215" fill="rgba(15,23,42,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ENTITY</text>
        <text x="360" y="238" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', sans-serif">选科 SUBJECT_CHOICE</text>
        <text x="360" y="258" fill="#475569" font-size="9" font-family="'Geist Mono', monospace"># id · → student_id ⌇</text>
        <text x="360" y="274" fill="#475569" font-size="9" font-family="'Geist Mono', monospace">chosen : 首选+再选组合</text>
        <text x="360" y="290" fill="#475569" font-size="9" font-family="'Geist Mono', monospace">academic_year + effective_term</text>
        <text x="360" y="312" fill="#94a3b8" font-size="9" font-family="'Geist Mono', monospace">UK: tenant+student+学年+生效学期</text>
      </g>

      <!-- TEACHING_CLASS -->
      <g>
        <rect x="704" y="80" width="240" height="120" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
        <rect x="712" y="86" width="44" height="12" rx="2" fill="none" stroke="rgba(15,23,42,0.40)" stroke-width="0.8"/>
        <text x="734" y="95" fill="rgba(15,23,42,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ENTITY</text>
        <text x="712" y="118" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', sans-serif">教学班 TEACHING_CLASS</text>
        <text x="712" y="138" fill="#475569" font-size="9" font-family="'Geist Mono', monospace"># id · → grade_id · → subject_id</text>
        <text x="712" y="154" fill="#475569" font-size="9" font-family="'Geist Mono', monospace">sequence · academic_year</text>
        <text x="712" y="170" fill="#94a3b8" font-size="9" font-family="'Geist Mono', monospace">UK: 六元(含 term+sequence)</text>
      </g>

      <!-- TEACHING_CLASS_STUDENT -->
      <g>
        <rect x="704" y="248" width="240" height="112" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
        <rect x="712" y="254" width="44" height="12" rx="2" fill="none" stroke="rgba(15,23,42,0.40)" stroke-width="0.8"/>
        <text x="734" y="263" fill="rgba(15,23,42,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ENTITY</text>
        <text x="712" y="286" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', sans-serif">教学班成员</text>
        <text x="712" y="306" fill="#475569" font-size="9" font-family="'Geist Mono', monospace"># id · → teaching_class_id</text>
        <text x="712" y="322" fill="#475569" font-size="9" font-family="'Geist Mono', monospace">→ student_id · UK 二元</text>
        <text x="712" y="338" fill="#94a3b8" font-size="9" font-family="'Geist Mono', monospace">走班制核心关联表</text>
      </g>

      <!-- TEACHING_CLASS_SCHEDULE -->
      <g>
        <rect x="352" y="376" width="284" height="104" rx="6" fill="rgba(15,23,42,0.03)" stroke="rgba(15,23,42,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
        <rect x="360" y="382" width="44" height="12" rx="2" fill="none" stroke="rgba(15,23,42,0.30)" stroke-width="0.8"/>
        <text x="382" y="391" fill="rgba(15,23,42,0.60)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AUX</text>
        <text x="360" y="414" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', sans-serif">教学班课表</text>
        <text x="360" y="434" fill="#475569" font-size="9" font-family="'Geist Mono', monospace"># id · → teaching_class_id</text>
        <text x="360" y="450" fill="#475569" font-size="9" font-family="'Geist Mono', monospace">weekday + period : UK</text>
        <text x="360" y="466" fill="#94a3b8" font-size="9" font-family="'Geist Mono', monospace">与行政班 schedule 并行,走班时段</text>
      </g>

      <!-- STUDENT 辅助 -->
      <g>
        <rect x="40" y="200" width="152" height="128" rx="6" fill="rgba(15,23,42,0.03)" stroke="rgba(15,23,42,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
        <rect x="48" y="206" width="44" height="12" rx="2" fill="none" stroke="rgba(15,23,42,0.30)" stroke-width="0.8"/>
        <text x="70" y="215" fill="rgba(15,23,42,0.60)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REF</text>
        <text x="48" y="238" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', sans-serif">学生 STUDENT</text>
        <text x="48" y="258" fill="#475569" font-size="9" font-family="'Geist Mono', monospace">见排课核心域</text>
        <text x="48" y="274" fill="#475569" font-size="9" font-family="'Geist Mono', monospace">选科按学生提交</text>
        <text x="48" y="290" fill="#475569" font-size="9" font-family="'Geist Mono', monospace">年级成员关系</text>
        <text x="48" y="306" fill="#94a3b8" font-size="9" font-family="'Geist Mono', monospace">grade_membership</text>
      </g>

      <!-- 图例 -->
      <line x1="40" y1="496" x2="936" y2="496" stroke="rgba(148,163,184,0.30)" stroke-width="0.8"/>
      <text x="40" y="516" fill="#475569" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <line x1="108" y1="512" x2="140" y2="512" stroke="#475569" stroke-width="1"/>
      <text x="148" y="515" fill="#475569" font-size="9" font-family="'Geist', sans-serif">外键</text>
      <line x1="196" y1="512" x2="228" y2="512" stroke="#475569" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="236" y="515" fill="#475569" font-size="9" font-family="'Geist', sans-serif">逻辑/辅助</text>
      <rect x="312" y="504" width="16" height="12" rx="2" fill="rgba(14,165,233,0.10)" stroke="#0ea5e9" stroke-width="1"/>
      <text x="336" y="515" fill="#475569" font-size="9" font-family="'Geist', sans-serif">聚合根</text>
    </svg>
  </div>
</body>
</html>
