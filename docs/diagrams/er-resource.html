<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>轻课堂 · 资源预约域 ER 图</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#f8fafc; --color-ink:#0f172a; --color-muted:#475569; --color-accent:#0ea5e9;
      --font-sans:'Geist','PingFang SC',system-ui,sans-serif; --font-serif:'Instrument Serif','Noto Serif SC',serif; --font-mono:'Geist Mono',ui-monospace,monospace; }
    body { font-family:var(--font-sans); background:var(--color-paper); color:var(--color-ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:3rem 2rem; }
    .frame { max-width:1120px; width:100%; }
    .eyebrow { font-family:var(--font-mono); font-size:0.66rem; font-weight:500; letter-spacing:0.18em; text-transform:uppercase; color:var(--color-muted); margin-bottom:0.5rem; }
    h1 { font-family:var(--font-serif); font-size:clamp(1.5rem,2.4vw + .75rem,2rem); font-weight:400; letter-spacing:-0.02em; line-height:1.15; margin-bottom:1.5rem; }
    svg { width:100%; min-width:900px; display:block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">ER / DATA MODEL · DOMAIN 9 / 10</p>
    <h1>资源预约域 · 实体关系</h1>
    <svg viewBox="0 0 1000 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="er-resource-title er-resource-desc">
      <title id="er-resource-title">轻课堂资源预约域实体关系图</title>
      <desc id="er-resource-desc">教室可被会议预约和班级分配规则锁定,座位表按班级存多版本,资源分配规则决定年级群组如何占用教室。</desc>
      <rect width="100%" height="100%" fill="#f8fafc"/>

      <!-- 连线 -->
      <path d="M 480 152 L 480 208" fill="none" stroke="#475569" stroke-width="1"/>
      <rect x="456" y="158" width="14" height="12" fill="#f8fafc"/><text x="463" y="167" font-size="8" fill="#475569" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>
      <rect x="456" y="196" width="14" height="12" fill="#f8fafc"/><text x="463" y="205" font-size="8" fill="#475569" font-family="'Geist Mono', monospace" text-anchor="middle">N</text>
      <rect x="488" y="172" width="60" height="14" fill="#f8fafc"/><text x="518" y="183" font-size="9" fill="#475569" font-family="'Geist', sans-serif" text-anchor="middle">预约时段</text>

      <path d="M 628 128 L 704 128" fill="none" stroke="#475569" stroke-width="1"/>
      <rect x="634" y="108" width="24" height="12" fill="#f8fafc"/><text x="646" y="117" font-size="8" fill="#7a8399" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>
      <rect x="676" y="108" width="24" height="12" fill="#f8fafc"/><text x="688" y="117" font-size="8" fill="#7a8399" font-family="'Geist Mono', monospace" text-anchor="middle">N</text>

      <path d="M 332 128 L 256 128" fill="none" stroke="#475569" stroke-width="1"/>
      <rect x="306" y="108" width="24" height="12" fill="#f8fafc"/><text x="318" y="117" font-size="8" fill="#7a8399" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>
      <rect x="258" y="108" width="24" height="12" fill="#f8fafc"/><text x="270" y="117" font-size="8" fill="#7a8399" font-family="'Geist Mono', monospace" text-anchor="middle">N</text>

      <path d="M 864 216 L 864 272" fill="none" stroke="#475569" stroke-width="1"/>
      <rect x="872" y="222" width="24" height="12" fill="#f8fafc"/><text x="884" y="231" font-size="8" fill="#7a8399" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>
      <rect x="872" y="258" width="24" height="12" fill="#f8fafc"/><text x="884" y="267" font-size="8" fill="#7a8399" font-family="'Geist Mono', monospace" text-anchor="middle">N</text>

      <!-- ROOM(聚合根) -->
      <g>
        <rect x="332" y="48" width="296" height="104" rx="6" fill="rgba(14,165,233,0.10)" stroke="#0ea5e9" stroke-width="1.2"/>
        <rect x="340" y="54" width="44" height="12" rx="2" fill="none" stroke="rgba(14,165,233,0.50)" stroke-width="0.8"/>
        <text x="362" y="63" fill="rgba(2,132,199,0.90)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ROOT</text>
        <text x="340" y="86" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', sans-serif">教室 ROOM</text>
        <text x="340" y="106" fill="#475569" font-size="9" font-family="'Geist Mono', monospace"># id · → building_id · capacity</text>
        <text x="340" y="122" fill="#475569" font-size="9" font-family="'Geist Mono', monospace">is_schedulable / is_exam / is_meeting</text>
        <text x="340" y="138" fill="#94a3b8" font-size="9" font-family="'Geist Mono', monospace">冲突=时段重叠,应用层校验</text>
      </g>

      <!-- ROOM_BOOKING -->
      <g>
        <rect x="332" y="208" width="296" height="128" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
        <rect x="340" y="214" width="44" height="12" rx="2" fill="none" stroke="rgba(15,23,42,0.40)" stroke-width="0.8"/>
        <text x="362" y="223" fill="rgba(15,23,42,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ENTITY</text>
        <text x="340" y="246" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', sans-serif">教室预约 BOOKING</text>
        <text x="340" y="266" fill="#475569" font-size="9" font-family="'Geist Mono', monospace"># id · → room_id</text>
        <text x="340" y="282" fill="#475569" font-size="9" font-family="'Geist Mono', monospace">start_at ~ end_at 时段</text>
        <text x="340" y="298" fill="#475569" font-size="9" font-family="'Geist Mono', monospace">purpose · → booked_by</text>
        <text x="340" y="320" fill="#94a3b8" font-size="9" font-family="'Geist Mono', monospace">唯一性=重叠校验(非相等约束)</text>
      </g>

      <!-- RESOURCE_ALLOCATION_RULE -->
      <g>
        <rect x="40" y="72" width="216" height="112" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
        <rect x="48" y="78" width="44" height="12" rx="2" fill="none" stroke="rgba(15,23,42,0.40)" stroke-width="0.8"/>
        <text x="70" y="87" fill="rgba(15,23,42,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ENTITY</text>
        <text x="48" y="110" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', sans-serif">分配规则 RULE</text>
        <text x="48" y="130" fill="#475569" font-size="9" font-family="'Geist Mono', monospace"># id · name · cohort_label</text>
        <text x="48" y="146" fill="#475569" font-size="9" font-family="'Geist Mono', monospace">→ campus_id / building_ids</text>
        <text x="48" y="162" fill="#94a3b8" font-size="9" font-family="'Geist Mono', monospace">楼层段/教室特征约束</text>
      </g>

      <!-- ROOM_COHORT_ALLOCATION -->
      <g>
        <rect x="704" y="72" width="240" height="144" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
        <rect x="712" y="78" width="44" height="12" rx="2" fill="none" stroke="rgba(15,23,42,0.40)" stroke-width="0.8"/>
        <text x="734" y="87" fill="rgba(15,23,42,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ENTITY</text>
        <text x="712" y="110" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', sans-serif">群组教室占用</text>
        <text x="712" y="130" fill="#475569" font-size="9" font-family="'Geist Mono', monospace"># id · → rule_id · → room_id</text>
        <text x="712" y="146" fill="#475569" font-size="9" font-family="'Geist Mono', monospace">cohort_label · academic_year</text>
        <text x="712" y="162" fill="#475569" font-size="9" font-family="'Geist Mono', monospace">allocation_mode : 独占/共享</text>
        <text x="712" y="184" fill="#94a3b8" font-size="9" font-family="'Geist Mono', monospace">UK: tenant+rule+room</text>
      </g>

      <!-- SEAT_ARRANGEMENT -->
      <g>
        <rect x="704" y="272" width="240" height="128" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
        <rect x="712" y="278" width="44" height="12" rx="2" fill="none" stroke="rgba(15,23,42,0.40)" stroke-width="0.8"/>
        <text x="734" y="287" fill="rgba(15,23,42,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ENTITY</text>
        <text x="712" y="310" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', sans-serif">座位表 SEAT</text>
        <text x="712" y="330" fill="#475569" font-size="9" font-family="'Geist Mono', monospace"># id · → class_id</text>
        <text x="712" y="346" fill="#475569" font-size="9" font-family="'Geist Mono', monospace">rows×cols · student_map</text>
        <text x="712" y="362" fill="#475569" font-size="9" font-family="'Geist Mono', monospace">effective_from ~ to 版本</text>
        <text x="712" y="384" fill="#94a3b8" font-size="9" font-family="'Geist Mono', monospace">按生效日期多版本并存</text>
      </g>

      <!-- MEETING -->
      <g>
        <rect x="332" y="392" width="296" height="96" rx="6" fill="rgba(15,23,42,0.03)" stroke="rgba(15,23,42,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
        <rect x="340" y="398" width="44" height="12" rx="2" fill="none" stroke="rgba(15,23,42,0.30)" stroke-width="0.8"/>
        <text x="362" y="407" fill="rgba(15,23,42,0.60)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AUX</text>
        <text x="340" y="430" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', sans-serif">会议 MEETING</text>
        <text x="340" y="450" fill="#475569" font-size="9" font-family="'Geist Mono', monospace"># id · → room_id · organizer</text>
        <text x="340" y="466" fill="#475569" font-size="9" font-family="'Geist Mono', monospace">participant_ids · agenda · minutes</text>
        <text x="340" y="482" fill="#94a3b8" font-size="9" font-family="'Geist Mono', monospace">is_meeting_enabled 教室可开会</text>
      </g>

      <!-- 图例 -->
      <line x1="40" y1="440" x2="316" y2="440" stroke="rgba(148,163,184,0.30)" stroke-width="0.8"/>
      <text x="40" y="460" fill="#475569" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <line x1="108" y1="456" x2="140" y2="456" stroke="#475569" stroke-width="1"/>
      <text x="148" y="459" fill="#475569" font-size="9" font-family="'Geist', sans-serif">外键</text>
      <line x1="196" y1="456" x2="228" y2="456" stroke="#475569" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="236" y="459" fill="#475569" font-size="9" font-family="'Geist', sans-serif">逻辑/辅助</text>
      <rect x="664" y="440" width="16" height="12" rx="2" fill="rgba(14,165,233,0.10)" stroke="#0ea5e9" stroke-width="1"/>
      <text x="688" y="451" fill="#475569" font-size="9" font-family="'Geist', sans-serif">聚合根</text>
    </svg>
  </div>
</body>
</html>
