<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>轻课堂 · 组织与设施域 ER 图</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f8fafc; --color-ink: #0f172a; --color-muted: #475569;
      --color-accent: #0ea5e9;
      --font-sans: 'Geist', 'PingFang SC', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif SC', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1120px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
      text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
      letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">ER / DATA MODEL · DOMAIN 2 / 10</p>
    <h1>组织与设施域 · 实体关系</h1>
    <svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="er-org-infra-title er-org-infra-desc">
      <title id="er-org-infra-title">轻课堂组织与设施域实体关系图</title>
      <desc id="er-org-infra-desc">展示租户、校区、楼栋、教室的层级关系,组织单元自引用成树并由人员任职,租户配置与平台管理员辅助多租户管理。</desc>
      <rect width="100%" height="100%" fill="#f8fafc"/>

      <!-- 连线 -->
      <path d="M 500 128 L 500 184" fill="none" stroke="#475569" stroke-width="1"/>
      <rect x="476" y="132" width="14" height="12" fill="#f8fafc"/><text x="483" y="141" font-size="8" fill="#475569" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>
      <rect x="476" y="172" width="14" height="12" fill="#f8fafc"/><text x="483" y="181" font-size="8" fill="#475569" font-family="'Geist Mono', monospace" text-anchor="middle">N</text>

      <path d="M 500 336 L 500 392" fill="none" stroke="#475569" stroke-width="1"/>
      <rect x="476" y="340" width="14" height="12" fill="#f8fafc"/><text x="483" y="349" font-size="8" fill="#475569" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>
      <rect x="476" y="380" width="14" height="12" fill="#f8fafc"/><text x="483" y="389" font-size="8" fill="#475569" font-family="'Geist Mono', monospace" text-anchor="middle">N</text>

      <path d="M 616 240 L 704 240" fill="none" stroke="#475569" stroke-width="1"/>
      <rect x="622" y="220" width="28" height="12" fill="#f8fafc"/><text x="636" y="229" font-size="8" fill="#7a8399" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>
      <rect x="676" y="220" width="28" height="12" fill="#f8fafc"/><text x="690" y="229" font-size="8" fill="#7a8399" font-family="'Geist Mono', monospace" text-anchor="middle">N</text>

      <path d="M 384 240 L 296 240" fill="none" stroke="#475569" stroke-width="1"/>
      <rect x="352" y="220" width="28" height="12" fill="#f8fafc"/><text x="366" y="229" font-size="8" fill="#7a8399" font-family="'Geist Mono', monospace" text-anchor="middle">1</text>
      <rect x="298" y="220" width="28" height="12" fill="#f8fafc"/><text x="312" y="229" font-size="8" fill="#7a8399" font-family="'Geist Mono', monospace" text-anchor="middle">N</text>

      <!-- TENANT(聚合根) -->
      <g>
        <rect x="368" y="40" width="264" height="88" rx="6" fill="rgba(14,165,233,0.10)" stroke="#0ea5e9" stroke-width="1.2"/>
        <rect x="376" y="46" width="44" height="12" rx="2" fill="none" stroke="rgba(14,165,233,0.50)" stroke-width="0.8"/>
        <text x="398" y="55" fill="rgba(2,132,199,0.90)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ROOT</text>
        <text x="376" y="78" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', sans-serif">租户 TENANT</text>
        <text x="376" y="98" fill="#475569" font-size="9" font-family="'Geist Mono', monospace"># id · code : UK 学校代码</text>
        <text x="376" y="114" fill="#475569" font-size="9" font-family="'Geist Mono', monospace">name · province · gaokao_mode</text>
      </g>

      <!-- CAMPUS -->
      <g>
        <rect x="368" y="184" width="248" height="152" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
        <rect x="376" y="190" width="44" height="12" rx="2" fill="none" stroke="rgba(15,23,42,0.40)" stroke-width="0.8"/>
        <text x="398" y="199" fill="rgba(15,23,42,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ENTITY</text>
        <text x="376" y="222" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', sans-serif">校区 CAMPUS</text>
        <text x="376" y="242" fill="#475569" font-size="9" font-family="'Geist Mono', monospace"># id : int</text>
        <text x="376" y="258" fill="#475569" font-size="9" font-family="'Geist Mono', monospace">name : 租户内 UK</text>
        <text x="376" y="274" fill="#475569" font-size="9" font-family="'Geist Mono', monospace">address : 地址</text>
        <text x="376" y="290" fill="#475569" font-size="9" font-family="'Geist Mono', monospace">student_capacity : 容量</text>
        <text x="376" y="318" fill="#94a3b8" font-size="9" font-family="'Geist Mono', monospace">UK: tenant_id + name</text>
      </g>

      <!-- BUILDING -->
      <g>
        <rect x="368" y="392" width="248" height="120" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
        <rect x="376" y="398" width="44" height="12" rx="2" fill="none" stroke="rgba(15,23,42,0.40)" stroke-width="0.8"/>
        <text x="398" y="407" fill="rgba(15,23,42,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ENTITY</text>
        <text x="376" y="430" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', sans-serif">楼栋 BUILDING</text>
        <text x="376" y="450" fill="#475569" font-size="9" font-family="'Geist Mono', monospace"># id : int</text>
        <text x="376" y="466" fill="#475569" font-size="9" font-family="'Geist Mono', monospace">→ campus_id</text>
        <text x="376" y="482" fill="#475569" font-size="9" font-family="'Geist Mono', monospace">name · floor_count</text>
        <text x="376" y="498" fill="#94a3b8" font-size="9" font-family="'Geist Mono', monospace">UK: tenant+campus+name</text>
      </g>

      <!-- ROOM -->
      <g>
        <rect x="704" y="184" width="232" height="152" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
        <rect x="712" y="190" width="44" height="12" rx="2" fill="none" stroke="rgba(15,23,42,0.40)" stroke-width="0.8"/>
        <text x="734" y="199" fill="rgba(15,23,42,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ENTITY</text>
        <text x="712" y="222" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', sans-serif">教室 ROOM</text>
        <text x="712" y="242" fill="#475569" font-size="9" font-family="'Geist Mono', monospace"># id : int</text>
        <text x="712" y="258" fill="#475569" font-size="9" font-family="'Geist Mono', monospace">→ building_id</text>
        <text x="712" y="274" fill="#475569" font-size="9" font-family="'Geist Mono', monospace">capacity · room_type</text>
        <text x="712" y="290" fill="#475569" font-size="9" font-family="'Geist Mono', monospace">is_schedulable / is_exam</text>
        <text x="712" y="318" fill="#94a3b8" font-size="9" font-family="'Geist Mono', monospace">UK: tenant+building+name</text>
      </g>

      <!-- ORGANIZATION_UNIT -->
      <g>
        <rect x="40" y="184" width="256" height="152" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1"/>
        <rect x="48" y="190" width="44" height="12" rx="2" fill="none" stroke="rgba(15,23,42,0.40)" stroke-width="0.8"/>
        <text x="70" y="199" fill="rgba(15,23,42,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ENTITY</text>
        <text x="48" y="222" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', sans-serif">组织单元 ORG_UNIT</text>
        <text x="48" y="242" fill="#475569" font-size="9" font-family="'Geist Mono', monospace"># id : int</text>
        <text x="48" y="258" fill="#475569" font-size="9" font-family="'Geist Mono', monospace">→ parent_id : 树自引用</text>
        <text x="48" y="274" fill="#475569" font-size="9" font-family="'Geist Mono', monospace">unit_type : 年级部/教研组</text>
        <text x="48" y="290" fill="#475569" font-size="9" font-family="'Geist Mono', monospace">cohort_label · academic_year</text>
        <text x="48" y="318" fill="#94a3b8" font-size="9" font-family="'Geist Mono', monospace">年级管理中心唯一(标记)</text>
      </g>

      <!-- TENANT_CONFIG / PLATFORM_ADMIN 说明卡 -->
      <g>
        <rect x="704" y="392" width="232" height="120" rx="6" fill="rgba(15,23,42,0.03)" stroke="rgba(15,23,42,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
        <rect x="712" y="398" width="44" height="12" rx="2" fill="none" stroke="rgba(15,23,42,0.30)" stroke-width="0.8"/>
        <text x="734" y="407" fill="rgba(15,23,42,0.60)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AUX</text>
        <text x="712" y="430" fill="#0f172a" font-size="12" font-weight="600" font-family="'Geist', sans-serif">配置与平台管理</text>
        <text x="712" y="450" fill="#475569" font-size="9" font-family="'Geist Mono', monospace">tenant_config : KV 配置</text>
        <text x="712" y="466" fill="#475569" font-size="9" font-family="'Geist Mono', monospace">  UK tenant+key · 方案/标记</text>
        <text x="712" y="482" fill="#475569" font-size="9" font-family="'Geist Mono', monospace">platformadmin : 平台超管</text>
        <text x="712" y="498" fill="#94a3b8" font-size="9" font-family="'Geist Mono', monospace">staff_appointment 见权限域</text>
      </g>

      <!-- 图例 -->
      <line x1="40" y1="536" x2="936" y2="536" stroke="rgba(148,163,184,0.30)" stroke-width="0.8"/>
      <text x="40" y="552" fill="#475569" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
      <line x1="108" y1="549" x2="140" y2="549" stroke="#475569" stroke-width="1"/>
      <text x="148" y="552" fill="#475569" font-size="9" font-family="'Geist', sans-serif">外键</text>
      <line x1="196" y1="549" x2="228" y2="549" stroke="#475569" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="236" y="552" fill="#475569" font-size="9" font-family="'Geist', sans-serif">逻辑/辅助</text>
      <rect x="312" y="540" width="16" height="12" rx="2" fill="rgba(14,165,233,0.10)" stroke="#0ea5e9" stroke-width="1"/>
      <text x="336" y="552" fill="#475569" font-size="9" font-family="'Geist', sans-serif">聚合根</text>
    </svg>
  </div>
</body>
</html>
