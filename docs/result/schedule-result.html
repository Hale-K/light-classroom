.title-card span{display:block;font-size:11px;letter-spacing:.15em;color:#ffd770;text-transform:uppercase}
.title-card strong{display:block;margin-top:6px;font-size:22px;color:#f0e8d8}

.detail span{display:block;font-size:11px;letter-spacing:.15em;color:#ffd770;text-transform:uppercase;margin-bottom:8px}
.detail h2{margin:0;font-size:28px;color:#ffd770;text-shadow:0 0 12px #946b2d}

.detail small{display:block;margin-top:6px;font-size:12px;color:var(--muted)}
.hint{position:absolute;bottom:20px;left:20px;z-index:2;font-size:12px;color:var(--soft);padding:8px 14px;border:1px solid var(--line);border-radius:10px;background:#1a1423aa}
.foot{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:26px;padding-top:18px;border-top:1px solid var(--line);color:var(--soft);font-size:12px}

function findLesson(){const cls=actualClasses[classIndex];const lessons=cls.rows.filter(r=>r[0]===day+1&&r[1]===period&&(r[2]==='all'||r[2]===parity));return lessons.length>0?lessons[0]:null;}

function initMagicScene(){
  if(!window.THREE||!art) return;
  const THREE=window.THREE;
  const scene=new THREE.Scene();
  const camera=new THREE.PerspectiveCamera(42,1,.1,100);
  camera.position.set(0,.15,7.8);
  let renderer;
  try{
    renderer=new THREE.WebGLRenderer({alpha:true,antialias:true,powerPreference:'high-performance'});
  }catch(error){
    return;
  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  renderer.setClearColor(0x000000,0);
  renderer.domElement.className='magic-canvas';
  renderer.domElement.setAttribute('aria-hidden','true');
  art.appendChild(renderer.domElement);

  const dustGeometry=new THREE.BufferGeometry();
  const dustCount=760;
  const positions=new Float32Array(dustCount*3);
  const colors=new Float32Array(dustCount*3);
  for(let i=0;i<dustCount;i++){
    const radius=.75+Math.random()*3.5;
    const angle=Math.random()*Math.PI*2;
    const height=(Math.random()-.5)*2.8;
    positions[i*3]=Math.cos(angle)*radius;
    positions[i*3+1]=height;
    positions[i*3+2]=Math.sin(angle)*radius*.56;
    const warm=Math.random()>.35;
    colors[i*3]=warm?1:.48;
    colors[i*3+1]=warm?.72:.82;
    colors[i*3+2]=warm?.32:.62;
  }
  dustGeometry.setAttribute('position',new THREE.BufferAttribute(positions,3));
  dustGeometry.setAttribute('color',new THREE.BufferAttribute(colors,3));
  const dust=new THREE.Points(dustGeometry,new THREE.PointsMaterial({size:.035,vertexColors:true,transparent:true,opacity:.78,blending:THREE.AdditiveBlending,depthWrite:false}));
  scene.add(dust);

  const sigil=new THREE.Group();
  const gold=new THREE.MeshBasicMaterial({color:0xeec76b,transparent:true,opacity:.48,blending:THREE.AdditiveBlending,depthWrite:false});
  const wine=new THREE.MeshBasicMaterial({color:0x9e4057,transparent:true,opacity:.22,blending:THREE.AdditiveBlending,depthWrite:false});
  const halo=new THREE.Mesh(new THREE.TorusGeometry(1.72,.012,8,128),gold);
  halo.rotation.x=Math.PI/2;
  sigil.add(halo);
  const innerHalo=new THREE.Mesh(new THREE.TorusGeometry(1.12,.008,8,96),wine);
  innerHalo.rotation.x=Math.PI/2;
  innerHalo.rotation.y=.32;
  sigil.add(innerHalo);
  const crest=new THREE.Mesh(new THREE.OctahedronGeometry(.88,.1),new THREE.MeshBasicMaterial({color:0xf0ca72,wireframe:true,transparent:true,opacity:.16,blending:THREE.AdditiveBlending}));
  crest.rotation.z=Math.PI/4;
  sigil.add(crest);
  scene.add(sigil);

  const pointer={x:0,y:0};
  const eased={x:0,y:0};
  art.addEventListener('pointermove',event=>{
    const rect=art.getBoundingClientRect();
    pointer.x=(event.clientX-rect.left)/rect.width*2-1;
    pointer.y=-((event.clientY-rect.top)/rect.height*2-1);
  });
  art.addEventListener('pointerleave',()=>{pointer.x=0;pointer.y=0;});
  const resize=()=>{
    const width=Math.max(1,art.clientWidth),height=Math.max(1,art.clientHeight);
    camera.aspect=width/height;
    camera.updateProjectionMatrix();
    renderer.setSize(width,height,false);
  };
  resize();
  if(window.ResizeObserver) new ResizeObserver(resize).observe(art);
  else window.addEventListener('resize',resize);

  const clock=new THREE.Clock();
  const animate=()=>{
    requestAnimationFrame(animate);
    const time=clock.getElapsedTime();
    eased.x+=(pointer.x-eased.x)*.035;
    eased.y+=(pointer.y-eased.y)*.035;
    dust.rotation.y=time*.018+eased.x*.08;
    dust.rotation.x=Math.sin(time*.16)*.05+eased.y*.035;
    sigil.rotation.z=time*.08+eased.x*.16;
    sigil.rotation.x=Math.sin(time*.22)*.08+eased.y*.08;
    halo.material.opacity=.32+Math.sin(time*1.5)*.1;
    innerHalo.material.opacity=.16+Math.sin(time*1.1+1)*.06;
    crest.rotation.y=time*.16;
    camera.position.x+=(eased.x*.18-camera.position.x)*.025;
    camera.position.y+=(.15+eased.y*.12-camera.position.y)*.025;
    camera.lookAt(0,0,0);
    renderer.render(scene,camera);
  };
  animate();
}
