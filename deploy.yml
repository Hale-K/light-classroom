# Deploy 部署声明 —— light-classroom（智衡课堂）
# 规范见 Deploy 面板 SPEC.md；本文件是该规范的参考实现：
#   web：React 19 + Vite 前端（frontend-react，构建产物 dist）
#   api：FastAPI 后端（backend，自带 docker-compose 全家桶：api/worker/postgres/redis/...）
# 前端以 /api/v1 相对路径调后端，发布时自动反代到宿主 8000 端口。

name: light-classroom

# 部署专用的环境配置：上传为 backend/.env（容器名互连版，见 .env.deploy 内注释）
env:
  file: backend/.env.deploy

services:
  - name: web
    type: web
    dir: frontend-react
    # 绕开 tsc 类型检查直接打包（src/pages/scheduling/RuleGroupWorkbench.tsx 尚有 TS 错误待修）
    build: pnpm exec vite build
    out: dist
    port: 80
    proxy:
      /api/v1: 8000

  - name: api
    type: docker
    dir: .
    # 部署专用编排（docker/ 目录）：去 Kafka/ZK + Alembic 迁移 + 学校数据种子
    compose: docker/docker-compose.deploy.yml
    port: 8000

# 交付清单：部署成功后面板自动生成给运营/老板看的访问清单
# url 模板可用 {host}；账号密码可用 ${ENV:键名} 引用 env.file 里的值
checklist:
  - name: 课堂前端（师生入口）
    url: "http://{host}"
  - name: 平台超管登录（同一前端，超管账号）
    url: "http://{host}"
    username: admin
    password: "${ENV:ADMIN_PASSWORD}"
  - name: API 接口文档（Swagger）
    url: "http://{host}:8000/docs"
  - name: API 健康检查
    url: "http://{host}:8000/health"
  - name: RabbitMQ 管理台
    url: "http://{host}:15672"
    username: "${ENV:RABBITMQ_DEFAULT_USER}"
    password: "${ENV:RABBITMQ_DEFAULT_PASS}"
  - name: MinIO 控制台（文件中心）
    url: "http://{host}:9011"
    username: "${ENV:MINIO_ACCESS_KEY}"
    password: "${ENV:MINIO_SECRET_KEY}"
