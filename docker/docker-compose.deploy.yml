# 智衡后端 部署环境编排（Deploy 面板使用；文件位于 docker/ 子目录，路径相对本文件）
# 与开发版 docker-compose.yml 的区别：
#   - 去掉 Kafka + Zookeeper（代码中尚无任何生产/消费者，纯占位基础设施，省 ~1.5G 内存）
#   - schema-init：把 db/schema/*.sql 灌进 Postgres（可重复执行，含 ai_provider）
#   - db-seed：首部署导入学校业务数据（默认注释）
#   - api 去掉 --reload 与源码挂载（用镜像内代码）
#   - postgres/redis 不对宿主机暴露端口；RabbitMQ 管理台、MinIO 对外
# 启动：docker compose -f docker/docker-compose.deploy.yml up -d --build
# 当前 APP_ENV=dev：api 首启还会 create_all + 菜单种子；schema-init 在 api 健康后再灌 SQL，补齐服务商表/菜单
name: light-classroom-api

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16
    environment:
      POSTGRES_USER: zhiheng
      POSTGRES_PASSWORD: zhiheng
      POSTGRES_DB: zhiheng
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhiheng"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: docker.m.daocloud.io/library/rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: lightclassroom
      RABBITMQ_DEFAULT_PASS: Ay29XrHtqDblUW4u
    ports:
      - "15672:15672"
    volumes: ["rabbitmqdata:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 8

  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: lightclassroom
      MINIO_ROOT_PASSWORD: lightclassroom
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s

  # 等 API 把基础表建好后，再灌 db/schema（服务商表 + 菜单权限）
  schema-init:
    image: postgres:16-alpine
    depends_on:
      postgres: {condition: service_healthy}
      api: {condition: service_healthy}
    environment:
      PGHOST: postgres
      PGUSER: zhiheng
      PGPASSWORD: zhiheng
      PGDATABASE: zhiheng
    volumes:
      - ../db/schema:/schema:ro
    command:
      - bash
      - -c
      - |
        set -e
        for f in /schema/*.sql; do
          echo "apply $$f"
          psql -v ON_ERROR_STOP=1 -f "$$f"
        done
        echo "schema-init done"
    restart: "no"

  # 学校业务数据导入：有 db/nstmy_tumi.sql 后再打开
  # db-seed:
  #   image: postgres:16-alpine
  #   depends_on:
  #     schema-init: {condition: service_completed_successfully}
  #   environment:
  #     PGHOST: postgres
  #     PGUSER: zhiheng
  #     PGPASSWORD: zhiheng
  #     PGDATABASE: zhiheng
  #   volumes:
  #     - ../db/nstmy_tumi.sql:/seed/nstmy_tumi.sql:ro
  #   command: >
  #     bash -c "psql -tAc \"SELECT count(*) FROM tenant WHERE code='nstmy'\" | grep -q 1
  #     && echo 'nstmy 数据已存在，跳过导入'
  #     || psql -v ON_ERROR_STOP=1 -f /seed/nstmy_tumi.sql"
  #   restart: "no"

  api:
    build:
      context: ../backend
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      minio: {condition: service_healthy}
    env_file: ../.env
    ports: ["8000:8000"]
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s

  worker:
    build:
      context: ../backend
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    env_file: ../.env
    command: celery -A app.workers.celery_app worker -Q scheduling,academic --concurrency=2 --loglevel=info
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  rabbitmqdata:
  miniodata:
