# 智衡后端 部署环境编排（Deploy 面板使用；文件位于 docker/ 子目录，路径相对本文件）
# 与开发版 docker-compose.yml 的区别：
#   - 去掉 Kafka + Zookeeper（代码中尚无任何生产/消费者，纯占位基础设施，省 ~1.5G 内存）
#   - 表结构由 API 启动时自动创建（以 app/models 为准，幂等；全量结构见 db/baseline_schema.sql）
#   - 首部署导入演示数据：把 db/seed_tummi_data.sql 灌进 Postgres 即可
#   - api 去掉 --reload 与源码挂载（用镜像内代码）
#   - postgres/redis 不对宿主机暴露端口；RabbitMQ 管理台、MinIO 对外
# 启动：docker compose -f docker/docker-compose.deploy.yml up -d --build
name: light-classroom-api

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16
    mem_limit: 768m
    environment:
      POSTGRES_USER: zhiheng
      POSTGRES_PASSWORD: zhiheng
      POSTGRES_DB: zhiheng
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhiheng"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    mem_limit: 256m
    command: redis-server --appendonly yes
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 2C4G 服务器内存护栏：单容器失控只杀容器（任务报错重试），不再整机僵死
  # （ollama 已下线：GLM 走云端 API，本地推理容器太占内存；数据卷 ollamadata 保留）
  rabbitmq:
    image: docker.m.daocloud.io/library/rabbitmq:3.13-management-alpine
    mem_limit: 512m
    environment:
      RABBITMQ_DEFAULT_USER: lightclassroom
      RABBITMQ_DEFAULT_PASS: Ay29XrHtqDblUW4u
    ports:
      - "15672:15672"
    volumes: ["rabbitmqdata:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 8

  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    mem_limit: 512m
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: lightclassroom
      MINIO_ROOT_PASSWORD: lightclassroom
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s

  api:
    build:
      context: ../backend
    mem_limit: 1280m
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      minio: {condition: service_healthy}
    env_file: ../backend/.env
    volumes:
      - ${BGE_MODEL_HOST_PATH:-../models/bge-base-zh-v1.5}:/models/bge-base-zh-v1.5:ro
    ports: ["8000:8000"]
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s

  worker:
    build:
      context: ../backend
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    mem_limit: 1792m
    env_file: ../backend/.env
    volumes:
      - ${BGE_MODEL_HOST_PATH:-../models/bge-base-zh-v1.5}:/models/bge-base-zh-v1.5:ro
    command: celery -A app.workers.celery_app worker -Q scheduling,academic --concurrency=2 --loglevel=info
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  rabbitmqdata:
  miniodata:
  ollamadata:
