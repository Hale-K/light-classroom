}
.tab-btn.active {

}

.preview-stage {

}

}
.phone-label {
  font-size: 13px;
  font-weight: 500;
  color: #888;
  letter-spacing: 0.3px;
}

/* 手机外壳（细边框） */
.phone-frame {
  position: relative;
  width: 340px;
  height: 737px;
  border-radius: 44px;
  background: #1a1a1a;
  padding: 4px;
  box-shadow:
    0 0 0 1px #333,
    0 16px 48px rgba(0,0,0,0.28),
    inset 0 0 4px rgba(255,255,255,0.05);
}

/* 屏幕区域 */
.phone-screen {
  width: 100%;
  height: 100%;
  border-radius: 40px;
  overflow: hidden;
  position: relative;
  background: #fff;
  display: flex;
  flex-direction: column;
}

/* 状态栏 */
.status-bar {
  position: relative;
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 11px 22px 0 22px;
  height: 44px;
  flex-shrink: 0;
  background: #fff;
  margin-bottom: -1px;
}
.status-bar-left {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.5px;
}
.status-bar-center {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  top: 11px;
  width: 100px;
  height: 26px;
  background: #1a1a1a;
  border-radius: 16px;
}
.status-bar-right {
  display: flex;
  align-items: center;
  gap: 6px;
}
.status-bar-right svg {
  display: block;
}

/* 内嵌 iframe */
.phone-content {
  flex: 1;
  overflow: hidden;
}
.phone-content iframe {
  width: 100%;
  height: 100%;
  border: none;
  scrollbar-width: none;
}
.phone-content iframe::-webkit-scrollbar { display: none; }

/* 底部横条 */
.phone-home-indicator {
  position: absolute;
  bottom: 7px;
  left: 50%;
  transform: translateX(-50%);
  width: 108px;
  height: 4px;
  background: rgba(0,0,0,0.2);
  border-radius: 3px;
  z-index: 200;
}

/* 窄屏响应式：Tab 切换模式 */
@media (max-width: 700px) {
  .tab-bar {
    display: flex;
  }
  .preview-stage {
    transform: none !important;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }
  .phone-block {
    max-width: 340px;
    width: 100%;
  }
  .phone-block.hidden {
    display: none;
  }
  .phone-label {
    display: none;
  }
}
</style>

<script>
// 缩放逻辑（宽屏保持）
(function() {
  var stage = document.querySelector('.preview-stage');
  var REF_W = 750;
  var REF_H = 800;
  function fit() {
    if (window.innerWidth <= 700) {
      stage.style.transform = '';
      return;
    }
    var sw = window.innerWidth / REF_W;
    var sh = window.innerHeight / REF_H;
    var s = Math.min(sw, sh, 1.3);
    stage.style.transform = 'scale(' + s + ')';
  }
  stage.style.transformOrigin = 'center center';
  fit();
  window.addEventListener('resize', fit);
})();

// Tab 切换逻辑（窄屏）
function switchTab(target) {
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.target === target);
  });
  document.getElementById('block-feed').classList.toggle('hidden', target !== 'feed');
  document.getElementById('block-detail').classList.toggle('hidden', target !== 'detail');
}

// 监听来自 iframe 的消息
window.addEventListener('message', (e) => {
  if (e.data === 'switchToDetail') {
    switchTab('detail');
  }
  if (e.data === 'switchToFeed') {
    switchTab('feed');
  }
});

// 初始化：窄屏默认显示信息流
if (window.innerWidth <= 700) {
  switchTab('feed');
}

// 窗口 resize 时恢复宽屏双列
window.addEventListener('resize', () => {
  if (window.innerWidth > 700) {
    document.getElementById('block-feed').classList.remove('hidden');
    document.getElementById('block-detail').classList.remove('hidden');
  } else {
    const active = document.querySelector('.tab-btn.active');
    if (active) switchTab(active.dataset.target);
  }
});
</script>
