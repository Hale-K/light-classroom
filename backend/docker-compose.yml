# 智衡后端开发环境编排
# 启动：docker compose up -d
# 包含：PostgreSQL + Redis + Kafka(Zookeeper) + API + Celery Worker
version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zhiheng
      POSTGRES_PASSWORD: zhiheng
      POSTGRES_DB: zhiheng
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhiheng"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports: ["2181:2181"]
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -q 1 localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      zookeeper: {condition: service_healthy}
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports: ["9092:9092"]
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 8

  api:
    build: .
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      kafka: {condition: service_started}
    env_file: .env
    ports: ["8000:8000"]
    volumes: ["./app:/app/app"]   # 热重载
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s

  worker:
    build: .
    depends_on:
      redis: {condition: service_healthy}
      kafka: {condition: service_started}
    env_file: .env
    volumes: ["./app:/app/app"]
    command: celery -A app.workers.celery_app worker --loglevel=info
    # TODO: 创建 app/workers/celery_app.py 后启用

volumes:
  pgdata:
  redisdata:
