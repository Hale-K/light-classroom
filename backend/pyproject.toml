[project]
name = "light-classroom-backend"
version = "0.1.0"
description = "智衡 toB 普通高中教务闭环系统 - 后端"
requires-python = ">=3.11"
dependencies = [
    # Web 框架
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    # ORM：SQLModel（Pydantic + SQLAlchemy 二合一，对标 MyBatis-Plus 的基础）
    "sqlmodel>=0.0.16",
    "sqlalchemy[asyncio]>=2.0.25",
    "asyncpg>=0.29.0",          # PostgreSQL async driver
    "psycopg2-binary>=2.9.9",  # PostgreSQL sync driver（兼容备用）
    # 配置
    "pydantic-settings>=2.1.0",
    # 认证
    "python-jose[cryptography]>=3.3.0",  # JWT
    "bcrypt>=4.0.1",                     # 密码哈希
    # 异步任务
    "celery>=5.3.0",
    "amqp>=5.2.0",
    "redis>=5.0.0",
    # 排课求解器（CP-SAT）
    "ortools>=9.0",
    # 消息队列（Kafka 事件总线）
    "confluent-kafka>=2.3.0",
    # 对象存储（腾讯云 COS / MinIO）
    "cos-python-sdk-v5>=1.9.0",
    "minio>=7.2.0",
    "openpyxl>=3.1.0",
    # 监控埋点（Prometheus /metrics）
    "prometheus-fastapi-instrumentator>=7.0.0",
    # 数据库迁移
    # LLM 客户端（OpenAI 兼容协议，可配 DeepSeek/GLM/通义）
    "openai>=1.12.0",
    # PDF 渲染
    "weasyprint>=60.0",
    # 工具
    "python-multipart>=0.0.9",  # 文件上传
    "httpx>=0.27.0",            # HTTP 客户端
    "tiktoken>=0.14.0",         # LLM 上下文 Token 计数与预算
    "pgvector>=0.4,<1",         # PostgreSQL vector 类型与 SQLAlchemy/SQLModel 集成
    "sentence-transformers>=5.0,<6",  # 本地 BGE 向量生成
    "loguru>=0.7.0",           # 日志
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",            # lint
    "mypy>=1.8.0",            # 类型检查
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
