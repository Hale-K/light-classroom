# 智衡专属 RabbitMQ（排课 Celery broker）
# 本机 PostgreSQL / Redis 已直连复用，只补消息队列。
# 启动：docker compose -f docker-compose.rabbitmq.yml up -d
# 停止：docker compose -f docker-compose.rabbitmq.yml down
# 管理台：http://localhost:15672  guest / guest
services:
  zhiheng-rabbitmq:
    image: docker.m.daocloud.io/library/rabbitmq:3.13-management-alpine
    container_name: zhiheng-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  rabbitmq-data:
